name: Update packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated package names (empty = all)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip

      - name: Save current versions
        run: cp versions.json /tmp/versions-old.json

      - name: Run update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOT_BIN_DIR: /tmp/staging/bin
        run: |
          mkdir -p /tmp/staging/bin
          if [[ -n "${{ inputs.packages }}" ]]; then
            ./scripts/update.sh ${{ inputs.packages }}
          else
            ./scripts/update.sh
          fi

      - name: Check for changes
        id: diff
        run: |
          if diff -q /tmp/versions-old.json versions.json > /dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No package changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump CHANGELOG
        if: steps.diff.outputs.changed == 'true'
        id: bump
        run: |
          VERSION=$(python3 scripts/bump-changelog.py /tmp/versions-old.json versions.json)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Bumped to ${VERSION}"

      - name: Create PR
        if: steps.diff.outputs.changed == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update packages to v${{ steps.bump.outputs.version }}"
          branch: chore/update-packages
          title: "chore: update packages to v${{ steps.bump.outputs.version }}"
          body: |
            ## Summary
            Automated package update to v${{ steps.bump.outputs.version }}. See CHANGELOG.md for details.
          base: master

      - name: Merge PR
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge ${{ steps.create-pr.outputs.pull-request-number }} --squash --delete-branch

      - name: Trigger release
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GITHUB_TOKEN push events don't trigger workflows,
          # so dispatch the release workflow explicitly
          gh workflow run release.yml
